# Tests, Lizenz- und Leak-Prüfung auf GitHub-eigenen Runnern. Actions auf Commit-Hashes festgelegt (ein umgehängter Tag
# käme sonst an die Musterliste). Keine Secrets außer der Musterliste für die
# Leak-Prüfung; bei Pull Requests aus Forks fehlt sie, dann laufen nur die allgemeinen Muster.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: agent/go.mod
      - run: go vet ./...
      - run: go test ./...
      # Keine GPL/LGPL-artigen Abhängigkeiten (vertragen sich nicht mit der Lizenz). Ignoriert: der eigene Code (Lizenz
      # liegt im Repo-Wurzelverzeichnis, außerhalb des Moduls), xi2/xz (gemeinfrei) und modernc.org/mathutil (BSD),
      # deren Lizenzdateien go-licenses nicht erkennt.
      - name: Dependency licenses
        run: |
          go install github.com/google/go-licenses@v1.6.0
          "$(go env GOPATH)/bin/go-licenses" check ./... --disallowed_types=forbidden,restricted \
            --ignore lablantern/agent --ignore github.com/xi2/xz --ignore modernc.org/mathutil

  leaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - run: scripts/check-leaks.sh
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
