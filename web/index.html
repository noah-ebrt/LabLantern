<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e1015" />

    <title>LabLantern</title>
    <meta name="description" content="Self-hosted vulnerability monitor and fleet security dashboard. Track CVEs, SBOMs, and package coverage across Linux hosts." />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Chat Link Previews (Discord, Slack, Telegram, WhatsApp, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LabLantern" />
    <meta property="og:description" content="Self-hosted vulnerability monitor and fleet security dashboard. Track CVEs, SBOMs, and package coverage across Linux hosts." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="LabLantern logo" />

    <!-- Twitter Card (summary card with favicon thumbnail preview) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LabLantern" />
    <meta name="twitter:description" content="Self-hosted vulnerability monitor and fleet security dashboard. Track CVEs, SBOMs, and package coverage across Linux hosts." />
    <meta name="twitter:image" content="/favicon.png" />
    <meta name="twitter:image:alt" content="LabLantern logo" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
