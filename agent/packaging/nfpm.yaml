# Paketbau mit nfpm: ARCH und VERSION setzt packaging/build-agent.sh.
name: lablantern-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: LabLantern <lablantern@localhost>
description: LabLantern agent – reports inventory and container SBOMs to the LabLantern master.
license: PolyForm-Noncommercial-1.0.0
contents:
  - src: build/lablantern-agent   # build-agent.sh kopiert das Binary der jeweiligen Architektur hierher
    dst: /usr/bin/lablantern-agent
    file_info: {mode: 0755}
  - src: packaging/systemd/lablantern-agentd.service
    dst: /usr/lib/systemd/system/lablantern-agentd.service
    file_info: {mode: 0644}
  - src: packaging/systemd/lablantern-collect.service
    dst: /usr/lib/systemd/system/lablantern-collect.service
    file_info: {mode: 0644}
  - src: packaging/systemd/lablantern-collect.path
    dst: /usr/lib/systemd/system/lablantern-collect.path
    file_info: {mode: 0644}
  - src: packaging/systemd/lablantern-action.service
    dst: /usr/lib/systemd/system/lablantern-action.service
    file_info: {mode: 0644}
  - src: packaging/systemd/lablantern-action.path
    dst: /usr/lib/systemd/system/lablantern-action.path
    file_info: {mode: 0644}
  - src: packaging/tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/lablantern.conf
    file_info: {mode: 0644}
scripts:
  preinstall: packaging/scripts/preinst.sh
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
  postremove: packaging/scripts/postrm.sh
